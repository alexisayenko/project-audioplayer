sonar.sources=server/app,web,scripts,ios/Sources,ios/MacSources
sonar.tests=server/tests,ios/Tests
sonar.test.inclusions=server/tests/**,ios/Tests/**,**/*.test.mjs
sonar.exclusions=**/*.json,web/dist/**,web/img/**,web/tokens.css,ios/Sources/DesignTokens.swift,server/backups-*/**,docs/**,**/node_modules/**,scripts/**/capture.html
sonar.python.version=3.11

# Offline scripts and screenshot harnesses fetch and capture one item at a time on purpose
# (rate-limited upstream APIs, a single canvas and a single save endpoint), so awaits in loops are intended.
sonar.issue.ignore.multicriteria=scriptSequentialAwait
sonar.issue.ignore.multicriteria.scriptSequentialAwait.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.scriptSequentialAwait.resourceKey=scripts/**