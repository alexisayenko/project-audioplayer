sonar.sources=server/app,web,scripts,ios/Sources,ios/MacSources
sonar.tests=server/tests,ios/Tests
sonar.test.inclusions=server/tests/**,ios/Tests/**,**/*.test.mjs
sonar.exclusions=**/*.json,web/dist/**,web/img/**,web/tokens.css,ios/Sources/DesignTokens.swift,server/backups-*/**,docs/**,**/node_modules/**,scripts/**/capture.html
sonar.python.version=3.11

# Offline scripts and screenshot harnesses fetch and capture one item at a time on purpose
# (rate-limited upstream APIs, a single canvas and a single save endpoint), so awaits in loops are intended.
sonar.issue.ignore.multicriteria=scriptSequentialAwait,webSequentialAwait,htmlCustomWidgets,htmlCanvas,cssSideToggleScopes,playlistsDocumentedNotFound,bracketsRegexFlagged
sonar.issue.ignore.multicriteria.scriptSequentialAwait.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.scriptSequentialAwait.resourceKey=scripts/**
# prefetch.js warms one item at a time to cap concurrent requests; the drafts import fetches playlist pages in order.
sonar.issue.ignore.multicriteria.webSequentialAwait.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.webSequentialAwait.resourceKey=web/js/prefetch.js,web/js/drafts-import.js

# The sidebar player group, the seek sliders and the visualizer overlay are custom widgets (role=group/slider/dialog,
# a focusable canvas); native fieldset, input and dialog elements would change semantics, focus handling and styling.
# NOSONAR comments do not clear Web:* issues, so the exclusion is scoped to this one file.
sonar.issue.ignore.multicriteria.htmlCustomWidgets.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.htmlCustomWidgets.resourceKey=web/index.html
sonar.issue.ignore.multicriteria.htmlCanvas.ruleKey=Web:S6825
sonar.issue.ignore.multicriteria.htmlCanvas.resourceKey=web/index.html

# .side-toggle is hidden by default and shown in a media query; merging the rules would break web/js/side-toggle-edge.test.mjs.
sonar.issue.ignore.multicriteria.cssSideToggleScopes.ruleKey=css:S4666
sonar.issue.ignore.multicriteria.cssSideToggleScopes.resourceKey=web/style.css

# The 404 for an unknown playlist is documented on every route that reaches this helper.
sonar.issue.ignore.multicriteria.playlistsDocumentedNotFound.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.playlistsDocumentedNotFound.resourceKey=server/app/routes/playlists.py

# _BRACKETS is applied to playlist and song titles capped at 300 characters (albums.MAX_TEXT); rewriting it would change matches.
sonar.issue.ignore.multicriteria.bracketsRegexFlagged.ruleKey=python:S8786
sonar.issue.ignore.multicriteria.bracketsRegexFlagged.resourceKey=server/app/album_youtube.py
