<!doctype html>
<meta charset="utf-8">
<title>Synthwave thumbnails</title>
<body style="background:#111;color:#ddd;font:14px sans-serif">
<pre id="log">running</pre>
<script type="module">
import { createSynth } from '/js/viz-synth-gl.js';
import { SYNTH_PRESET_LIST } from '/js/viz-synth-presets.js';

const W = 480;
const H = 270;
const BPM = 124;
const BEAT_MS = 60000 / BPM;
const SECONDS = 8;
const RPS = 16;
const TL_SECONDS = 60;
const SONG_START_S = 4;
const FRAME_MS = 1000 / 30;
const log = document.getElementById('log');
const lines = [];

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const bump = (i, c, w) => Math.exp(-(((i - c) / w) ** 2));

function makeSpectrum(seed) {
  const rand = rng(seed);
  const jitter = Array.from({ length: 64 }, () => rand());
  const phase = Array.from({ length: 64 }, () => rand() * 6.283);
  const bars = Array.from({ length: 16 }, () => 0.5 + 0.5 * rand());
  return (t) => {
    const beat = t / BEAT_MS;
    const f = beat % 1;
    const bar = Math.floor(beat / 4) % 16;
    const step = Math.floor(beat * 2) % 8;
    const kick = Math.exp(-f * 5);
    const snare = Math.floor(beat) % 2 === 1 ? Math.exp(-f * 7) : 0;
    const hat = Math.exp(-((beat * 2) % 1) * 9) * (step % 2 === 1 ? 1 : 0.6);
    const lead = bars[bar];
    const out = new Array(64);
    for (let i = 0; i < 64; i += 1) {
      const tilt = 0.6 * Math.exp(-i / 70);
      const pad = 0.16 * (0.6 + 0.4 * Math.sin(t * 0.0011 + phase[i]));
      const k = 0.4 * kick * bump(i, 4, 7);
      const s = 0.4 * snare * bump(i, 24, 16);
      const h = 0.4 * hat * (i > 34 ? 0.5 + 0.5 * jitter[i] : 0.1);
      const l = 0.35 * lead * bump(i, 8 + 24 * bars[(bar + 3) % 16], 6) * (0.7 + 0.3 * Math.sin(t * 0.004 + phase[i]));
      out[i] = Math.min(1, Math.max(0, tilt + pad + k + s + h + l + 0.05 * jitter[i]));
    }
    return out;
  };
}

function makeTimeline(spectrum) {
  const total = TL_SECONDS * RPS;
  const data = new Uint8Array(total * 64);
  for (let i = 0; i < total; i += 1) {
    const row = spectrum((i / RPS) * 1000);
    for (let j = 0; j < 64; j += 1) data[i * 64 + j] = Math.round(row[j] * 255);
  }
  return { data, bins: 64, rps: RPS, total, done: total };
}

for (const p of SYNTH_PRESET_LIST) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  document.body.appendChild(canvas);
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: true, stencil: false, preserveDrawingBuffer: true });
  let synth = null;
  try {
    synth = createSynth(canvas, { gl, settings: () => p.settings, reduced: false, quality: 2, onError: (e) => lines.push(`${p.id} error ${e.message}`) });
    synth.resize(W, H, 1);
    const spectrum = makeSpectrum(7);
    const timeline = makeTimeline(spectrum);
    let t = 1000;
    for (let i = 0; i < SECONDS * 30; i += 1) {
      t += FRAME_MS;
      const song = SONG_START_S * 1000 + (t - 1000);
      synth.draw(spectrum(song), t, { timeline, time: song / 1000 });
    }
    const blob = await (await fetch(canvas.toDataURL('image/png'))).blob();
    const res = await fetch(`/save?id=${p.id}`, { method: 'POST', body: blob });
    lines.push(`${p.id} ${await res.text()} bytes`);
  } catch (e) {
    lines.push(`${p.id} failed ${e.message}`);
  }
  synth?.dispose();
  gl.getExtension('WEBGL_lose_context')?.loseContext();
  canvas.remove();
}
log.textContent = `done\n${lines.join('\n')}`;
document.title = 'done';
</script>
