<!doctype html>
<meta charset="utf-8">
<title>Mirrored spectrum thumbnails</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/viz.css">
<body style="background:#111;color:#ddd;font:14px sans-serif">
<pre id="log">running</pre>
<script type="module">
import { drawBars } from '/js/viz-bars.js';
import { barCount, shapeBars } from '/js/viz-spectrum.js';
import { readVizColors, FALLBACK_COLORS, rgba } from '/js/viz-color.js';
import { MIRROR_PRESET_LIST } from '/js/viz-mirror-presets.js';

const W = 480;
const H = 270;
const ONLY = ['classic'];
const lines = [];

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function spectrum(n, seed) {
  const rand = rng(seed);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i += 1) {
    const x = i / n;
    const body = 0.75 * Math.exp(-(((x - 0.18) / 0.22) ** 2)) + 0.35 * Math.exp(-(((x - 0.55) / 0.2) ** 2)) + 0.18;
    out[i] = Math.min(1, Math.max(0, body * (0.7 + 0.3 * rand()) * (1 - 0.55 * x)));
  }
  return out;
}

for (const p of MIRROR_PRESET_LIST.filter((q) => ONLY.includes(q.id))) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = readVizColors(getComputedStyle(document.documentElement), FALLBACK_COLORS);
  ctx.fillStyle = rgba(colors.scrim, 1);
  ctx.fillRect(0, 0, W, H);
  const s = p.settings;
  const bars = shapeBars(spectrum(barCount(W, s.density), 7), 0);
  drawBars(ctx, W, H, bars, { colors, alpha: 0.85, dpr: 1, horizon: 0.5, span: s.height, widthFraction: s.width, reflection: s.reflection, glow: s.horizon });
  const blob = await (await fetch(canvas.toDataURL('image/png'))).blob();
  const res = await fetch(`/save?id=${p.id}`, { method: 'POST', body: blob });
  lines.push(`${p.id} ${await res.text()} bytes`);
}
document.getElementById('log').textContent = `done\n${lines.join('\n')}`;
document.title = 'done';
</script>
