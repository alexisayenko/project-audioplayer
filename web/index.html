<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Electrophone</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="t-body">
<div class="app">
<aside class="side">
  <div class="brand"><span class="brand-name t-title">Electrophone</span><span class="brand-sub t-caption">Offline music player</span></div>
  <nav id="nav" aria-label="Main">
    <a href="#/library" data-route="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 4v16M20 4v16"/></svg><span class="nav-label t-subhead">Library</span></a>
    <a href="#/add" data-route="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="nav-label t-subhead">Add</span></a>
    <a href="#/playback" data-route="playback"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l11 7-11 7z"/></svg><span class="nav-label t-subhead">Playback</span><span class="badge" id="nav-count" hidden></span></a>
    <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span class="nav-label t-subhead">Settings</span></a>
  </nav>
  <div class="server t-caption" role="status"><span class="led" id="server-led"></span><span id="server-text">Server</span></div>
</aside>

<div class="stage">
<div id="sync-warn" class="sync-warn t-subhead" role="status" hidden></div>

<main id="view"></main>

<section id="player" class="player" hidden aria-label="Playback">
  <div class="deck-col">
    <div class="deck" id="details">
      <div class="platter">
        <img id="player-cover" alt="" class="label">
        <span class="spindle"></span>
      </div>
      <span class="arm" aria-hidden="true"><span class="arm-head"></span></span>
      <span class="deck-led" aria-hidden="true"></span>
      <p class="empty-note t-subhead" id="player-empty" hidden>Nothing playing</p>
    </div>
    <div class="now" id="details-body">
      <p class="t-eyebrow now-eyebrow">NOW PLAYING</p>
      <h2 id="player-title" class="t-title"></h2>
      <p id="player-sub" class="sub t-subhead"></p>
      <div id="player-tags" class="tags"></div>
      <p class="facts t-caption"><span id="player-bpm"></span><span id="player-links" class="links"></span></p>
    </div>
    <div class="tray" role="group" aria-label="Transport">
      <div class="keys">
        <button class="key ghost toggle" id="p-shuffle" type="button" aria-pressed="false" aria-label="Shuffle: off" title="Shuffle"></button>
        <button class="key" id="p-prev" type="button" aria-label="Previous song"></button>
        <button class="key" id="p-back" type="button" aria-label="Back 5 seconds"></button>
        <button class="key lit" id="p-play" type="button" aria-label="Play or pause"></button>
        <button class="key" id="p-fwd" type="button" aria-label="Forward 5 seconds"></button>
        <button class="key" id="p-next" type="button" aria-label="Next song"></button>
        <button class="key ghost toggle" id="p-loop-one" type="button" aria-pressed="false" aria-label="Loop one song: off" title="Loop one song"></button>
        <button class="key ghost toggle" id="p-loop-all" type="button" aria-pressed="false" aria-label="Loop whole list: off" title="Loop whole list"></button>
      </div>
      <div class="scrub-row">
        <span class="t-time" id="t-cur">0:00</span>
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <span class="t-time" id="t-dur">0:00</span>
      </div>
    </div>
  </div>
  <div class="queue-col">
    <div class="plist-controls">
      <button class="btn" id="queue-clear" type="button">Clean playlist</button>
      <div class="fill-tags" id="fill-tags"></div>
      <button class="btn" id="tag-add" type="button" title="Add songs by tag">Add by tag</button>
      <span class="muted count t-caption" id="queue-count"></span>
    </div>
    <div class="queue">
      <p class="muted empty-note t-subhead" id="queue-empty">Queue is empty - add songs from Library</p>
      <ul id="queue-list" class="queue-list" aria-label="Current playlist"></ul>
    </div>
  </div>
</section>
</div>
</div>

<div id="mini" class="mini" hidden>
  <button class="mini-open" id="mini-open" aria-label="Open player">
    <img id="mini-cover" alt="" class="cover">
    <span class="mini-text"><b id="mini-title" class="t-headline"></b><small id="mini-artist" class="t-caption"></small></span>
  </button>
  <button class="key" id="mini-play" aria-label="Play or pause"></button>
  <button class="key" id="mini-next" aria-label="Next"></button>
  <div class="mini-progress"><div id="mini-bar"></div></div>
</div>

<dialog id="edit-dialog"></dialog>
<dialog id="filter-sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" class="toast t-subhead" role="status" hidden></div>
<audio id="audio" preload="metadata"></audio>
<script type="module" src="js/app.js"></script>
</body>
</html>
