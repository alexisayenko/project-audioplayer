<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Audio Player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M12 8v13.2a3.5 3.5 0 1 0 2 3.1V13l8-2v7.2a3.5 3.5 0 1 0 2 3.1V6z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Audio Player</h1>
  <nav id="nav">
    <a href="#/library" data-route="library">Library</a>
    <a href="#/add" data-route="add">Add</a>
    <a href="#/playback" data-route="playback">Playback<span class="badge" id="nav-count" hidden></span></a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>
</header>

<div id="sync-warn" class="sync-warn" role="status" hidden></div>

<main id="view"></main>

<div id="mini" class="mini" hidden>
  <button class="mini-open" id="mini-open" aria-label="Open player">
    <img id="mini-cover" alt="" class="cover">
    <span class="mini-text"><b id="mini-title"></b><small id="mini-artist"></small></span>
  </button>
  <button class="icon" id="mini-play" aria-label="Play or pause"></button>
  <button class="icon" id="mini-next" aria-label="Next">&#9197;</button>
  <div class="mini-progress"><div id="mini-bar"></div></div>
</div>

<section id="player" class="player" hidden aria-label="Playback">
  <p class="muted" id="player-empty" hidden>Nothing playing. Use the play button on a song in the Library.</p>
  <img id="player-cover" alt="" class="cover big">
  <h2 id="player-title"></h2>
  <p id="player-artist"></p>
  <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Seek">
  <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
  <div class="controls">
    <button class="icon" id="p-prev" aria-label="Previous">&#9198;</button>
    <button class="icon primary" id="p-play" aria-label="Play or pause"></button>
    <button class="icon" id="p-next" aria-label="Next">&#9197;</button>
  </div>
  <p class="queue-info" id="queue-info"></p>
  <div class="queue">
    <div class="queue-head"><h3>Up next</h3><button class="btn" id="queue-clear" type="button">Clear</button></div>
    <p class="muted" id="queue-empty">Nothing queued. Use the add button in the Library.</p>
    <ul id="queue-list" class="queue-list"></ul>
  </div>
</section>

<dialog id="edit-dialog"></dialog>
<div id="toast" class="toast" hidden></div>
<audio id="audio" preload="metadata"></audio>
<script type="module" src="js/app.js"></script>
</body>
</html>
