<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Electrophone</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="genres.css">
<link rel="stylesheet" href="stats.css">
</head>
<body class="t-body">
<div class="app">
<aside class="side">
  <button class="side-toggle" id="side-toggle" type="button" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="brand"><span class="brand-name">Electrophone</span><span class="brand-sub t-caption">Offline music player</span></div>
  <nav id="nav" aria-label="Main">
    <a href="#/library" data-route="library" title="Library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 4v16M20 4v16"/></svg><span class="nav-label">Library</span></a>
    <a href="#/playback" data-route="playback" title="Playback"><svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M7 5l11 7-11 7z"/></svg><span class="nav-label">Playback</span></a>
    <a href="#/genres" data-route="genres" title="Genres map"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 7.3l8-1M7.2 8.8l3.8 7.4M16.8 7.8l-3.8 8.4"/></svg><span class="nav-label">Genres map</span></a>
    <a href="#/stats" data-route="stats" title="Song stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16"/><circle cx="9" cy="14" r="1.2"/><circle cx="12.5" cy="9" r="1.2"/><circle cx="16" cy="15" r="1.2"/><circle cx="18" cy="8" r="1.2"/></svg><span class="nav-label">Song stats</span></a>
    <a href="#/settings" data-route="settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span class="nav-label">Settings</span></a>
  </nav>
  <output class="server t-caption"><span class="led" id="server-led"></span><span id="server-text">Server</span></output>
</aside>

<div class="stage">
<output id="sync-warn" class="sync-warn t-subhead" hidden></output>

<main id="view"></main>

<section id="player" class="player" hidden aria-label="Playback">
  <header class="page-head">
    <p class="t-eyebrow">ELECTROPHONE</p>
    <h1 class="t-display">Now playing</h1>
  </header>
  <div class="pb-grid">
    <div class="pb-main">
      <div class="cover-art noart" id="cover-art">
        <img id="player-cover" alt="">
        <span class="disc" aria-hidden="true"></span>
        <button class="cover-btn" id="cover-toggle" type="button" aria-label="Play" title="Play" hidden><span class="cover-icon" id="cover-icon" aria-hidden="true"></span></button>
        <div class="cover-text" id="cover-text" hidden>
          <h2 id="player-title" class="t-title">Nothing playing</h2>
          <p id="player-sub" class="t-body"></p>
        </div>
        <p class="empty-note t-subhead" id="player-empty">Nothing playing</p>
      </div>
      <output class="dl-note" id="player-dl" hidden><span class="t-subhead" id="player-dl-text"></span><button class="btn outline small" id="player-dl-btn" type="button" hidden>Download</button></output>
      <div class="pb-actions"><button class="icon round" id="p-download" type="button" title="Download" aria-label="Download" hidden></button><button class="icon round" id="p-edit" type="button" title="Edit song" aria-label="Edit song" hidden></button></div>
      <div class="pb-progress">
        <div id="scrub" class="scrubber" role="slider" tabindex="-1" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00 of 0:00" aria-disabled="true"><span class="scrub-rail"><span class="scrub-fill"></span></span><span class="scrub-thumb"></span><span class="scrub-bubble" aria-hidden="true">0:00</span></div>
        <div class="times t-time"><span id="t-cur">0:00</span><span id="t-dur">-0:00</span></div>
      </div>
      <div class="pb-controls">
        <fieldset class="tray" aria-label="Transport">
          <button class="key ghost toggle" id="p-shuffle" type="button" aria-pressed="false" aria-label="Shuffle: off"></button>
          <button class="key wide" id="p-prev" type="button" aria-label="Previous song"></button>
          <button class="key lit" id="p-play" type="button" aria-label="Play"></button>
          <button class="key wide" id="p-next" type="button" aria-label="Next song"></button>
          <button class="key ghost toggle" id="p-repeat" type="button" aria-pressed="false" aria-label="Repeat: off"></button>
        </fieldset>
        <div class="volume">
          <span class="knob" id="p-knob" aria-hidden="true"></span>
          <input type="range" id="p-volume" class="slider" min="0" max="100" value="100" step="1" aria-label="Volume">
          <span class="t-caption muted" id="p-volume-pct">100%</span>
        </div>
      </div>
      <div class="now" id="details-body" hidden>
        <div id="player-tags" class="tags"></div>
        <p class="facts t-caption"><span id="player-bpm"></span><span id="player-links" class="links"></span></p>
      </div>
    </div>
    <div class="queue-col">
      <div class="queue">
        <div class="queue-head">
          <div class="qtitle"><span class="t-headline">Queue</span><span class="muted t-caption" id="queue-count"></span></div>
          <div class="qactions">
            <button class="link-btn t-subhead strong" id="tag-add" type="button" title="Add songs by tag">Add by tag</button>
            <button class="link-btn t-subhead strong" id="queue-clear" type="button" title="Remove the upcoming songs and tag chips">Clear</button>
          </div>
        </div>
        <div class="fill-tags" id="fill-tags"></div>
        <p class="muted empty-note t-subhead" id="queue-empty">Queue is empty - add songs from Library</p>
        <ul id="queue-list" class="queue-list" aria-label="Current playlist"></ul>
      </div>
    </div>
  </div>
</section>
</div>
</div>

<section id="mini" class="mini" aria-label="Now playing" hidden>
  <button class="mini-open" id="mini-open" type="button" aria-label="Open player">
    <img id="mini-cover" alt="" class="cover">
    <span class="mini-text"><b id="mini-title" class="t-subhead"></b><small id="mini-artist" class="t-caption"></small></span>
  </button>
  <div class="mini-keys">
    <button class="key ghost toggle opt" id="mini-shuffle" type="button" aria-pressed="false" aria-label="Shuffle: off"></button>
    <button class="key opt" id="mini-prev" type="button" aria-label="Previous song"></button>
    <button class="key lit" id="mini-play" type="button" aria-label="Play"></button>
    <button class="key" id="mini-next" type="button" aria-label="Next song"></button>
    <button class="key ghost toggle opt" id="mini-repeat" type="button" aria-pressed="false" aria-label="Repeat: off"></button>
  </div>
  <div class="mini-actions" id="mini-actions">
    <button class="key ghost" id="mini-edit" type="button" aria-label="Edit details" title="Edit details"></button>
    <button class="key ghost" id="mini-locate" type="button" aria-label="Show in list" title="Show in list"></button>
    <button class="key ghost toggle" id="mini-playlist" type="button" aria-pressed="false" aria-label="Add to current playlist" title="Add to current playlist"></button>
  </div>
  <div class="mini-foot">
    <span class="t-time" id="mini-time">0:00 / 0:00</span>
    <div id="mini-scrub" class="scrubber mini-progress" role="slider" tabindex="-1" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00 of 0:00" aria-disabled="true"><span class="scrub-rail"><span class="scrub-fill"></span></span><span class="scrub-thumb"></span><span class="scrub-bubble" aria-hidden="true">0:00</span></div>
    <input type="range" id="mini-volume" class="slider" min="0" max="100" value="100" step="1" aria-label="Volume">
  </div>
</section>

<dialog id="add-dialog" aria-label="Add from YouTube or SoundCloud"></dialog>
<dialog id="edit-dialog"></dialog>
<dialog id="song-card" class="sheet card-dlg" aria-labelledby="song-card-title"></dialog>
<dialog id="filter-sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<output id="toast" class="toast t-subhead" hidden></output>
<audio id="audio" preload="metadata"></audio>
<script type="module" src="js/app.js"></script>
</body>
</html>
