# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen
name: AudioPlayer
options:
  bundleIdPrefix: com.alexisayenko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "20261013"
targets:
  AudioPlayer:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: Sources/AudioPlayer.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Audio Player
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleIconName: AppIcon
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        # The server is reached over a private Tailscale/LAN address via plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisayenko.audioplayer
        DEVELOPMENT_TEAM: L8C7TUQLBM
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
