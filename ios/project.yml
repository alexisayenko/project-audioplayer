# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen
name: AudioPlayer
options:
  bundleIdPrefix: com.alexisayenko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AudioPlayer:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Audio Player
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        # The server is reached over a private Tailscale/LAN address via plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisayenko.audioplayer
        DEVELOPMENT_TEAM: L8C7TUQLBM
