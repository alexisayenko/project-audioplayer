# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen
name: AudioPlayer
options:
  bundleIdPrefix: com.alexisayenko
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "20261034"
schemes:
  AudioPlayer:
    build:
      targets:
        AudioPlayer: all
    test:
      targets: [AudioPlayerTests]
    run:
      config: Debug
    archive:
      config: Release
  ElectrophoneMac:
    build:
      targets:
        ElectrophoneMac: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  AudioPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AudioPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisayenko.audioplayer.tests
  AudioPlayer:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: Sources/AudioPlayer.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Electrophone
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Electrophone listens through the microphone only while you use Tools such as Live BPM.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleIconName: AppIcon
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.alexisayenko.audioplayer.token-pill
            UTTypeDescription: Token pill
            UTTypeConformsTo: [public.data]
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        # The server is HTTPS (electrophone.cc); this blanket exception is a known gap and can be tightened (architecture.md, Known gaps).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisayenko.audioplayer
        DEVELOPMENT_TEAM: L8C7TUQLBM
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ElectrophoneMac:
    type: application
    platform: macOS
    sources:
      - path: MacSources
      - path: Sources
        includes:
          - Platform.swift
          - APIClient.swift
          - APIModels.swift
          - AudioFiles.swift
          - AuthService.swift
          - DesignTokens.swift
          - Endpoints.swift
          - GenreSuggest.swift
          - Keychain.swift
          - LibraryFilterModel.swift
          - LibraryStore.swift
          - LocalCover.swift
          - PlayerService.swift
          - PlayQueue.swift
          - PlayRecorder.swift
          - ServerLink.swift
          - ServiceIcons.swift
          - SongFormState.swift
          - StatData.swift
          - Settings.swift
          - TagLogic.swift
          - TokenField.swift
          - Tokens.swift
          - Track.swift
          - TransferBook.swift
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: MacSources/Electrophone.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.applesignin: [Default]
    info:
      path: MacSources/Info.plist
      properties:
        CFBundleDisplayName: Electrophone
        CFBundleName: Electrophone
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: "14.0"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.alexisayenko.audioplayer.token-pill
            UTTypeDescription: Token pill
            UTTypeConformsTo: [public.data]
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        GoogleClientID: $(GOOGLE_CLIENT_ID)
    settings:
      base:
        PRODUCT_NAME: Electrophone
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisayenko.audioplayer.mac
        DEVELOPMENT_TEAM: L8C7TUQLBM
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
